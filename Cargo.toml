[package]
name = "rapier-viewport-plugin"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Rapier 3D physics plugin for viewport-lib"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/grimandgreedy/rapier-viewport-plugin"
homepage = "https://github.com/grimandgreedy/rapier-viewport-plugin"
documentation = "https://docs.rs/rapier-viewport-plugin"
keywords = ["physics", "rapier", "viewport", "viewport-lib", "3d"]
categories = ["graphics", "simulation", "game-development"]
publish = true
exclude = ["examples/", "docs/", "LOG.md", "capability-coverage.md"]

[dependencies]
viewport-lib = "0.20"
rapier3d = { version = "0.32", features = ["default"] }
parry3d = "0.26"
glam = { version = "=0.30.10", features = ["bytemuck"] }
indexmap = "2"

# Examples are autodiscovered from examples/. They pull in eframe/wgpu and are
# excluded from the published package to keep it lean; run them from the repo.
[dev-dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts"] }
